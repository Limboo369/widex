<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Dex - Universal Android Desktop & Game Streaming</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="desktop">
        <!-- Desktop Shortcuts Grid -->
        <div class="desktop-icons">
            <div class="desktop-icon" id="icon-phone-mirror">
                <div class="icon-img phone-icon">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="5" y="2" width="14" height="20" rx="3" ry="3"/>
                        <line x1="12" y1="18" x2="12.01" y2="18" stroke-width="3"/>
                    </svg>
                </div>
                <span>Phone Screen</span>
            </div>

            <div class="desktop-icon" id="icon-game-mode">
                <div class="icon-img game-icon">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="6" y1="12" x2="10" y2="12"/>
                        <line x1="8" y1="10" x2="8" y2="14"/>
                        <circle cx="15" cy="11" r="1" fill="currentColor"/>
                        <circle cx="17" cy="13" r="1" fill="currentColor"/>
                        <path d="M17.5 19H6.5A3.5 3.5 0 0 1 3 15.5V11A5 5 0 0 1 8 6h8a5 5 0 0 1 5 5v4.5a3.5 3.5 0 0 1-3.5 3.5z"/>
                    </svg>
                </div>
                <span>Game Controller</span>
            </div>

            <div class="desktop-icon" id="icon-apps">
                <div class="icon-img apps-icon">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
                        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
                        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
                        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
                    </svg>
                </div>
                <span>App Drawer</span>
            </div>

            <div class="desktop-icon" id="icon-settings">
                <div class="icon-img settings-icon">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </div>
                <span>Wi-Fi Settings</span>
            </div>
        </div>

        <!-- Window Area -->
        <div id="window-container"></div>

        <!-- Start Menu Drawer -->
        <div id="start-menu" class="glass-panel hidden">
            <div class="start-header">
                <div class="user-profile">
                    <div class="profile-avatar">📱</div>
                    <div class="profile-info">
                        <h4 id="device-model-name">Android Device Host</h4>
                        <span id="device-ip-status" class="status-tag disconnected">Disconnected</span>
                    </div>
                </div>
                <div class="start-search">
                    <input type="text" id="app-search-input" placeholder="Search Android apps or games...">
                </div>
            </div>
            
            <div class="start-apps-section">
                <h3>Installed Applications</h3>
                <div id="app-grid" class="app-grid">
                    <!-- App cards dynamically loaded -->
                </div>
            </div>

            <div class="start-footer">
                <button class="btn btn-secondary" id="btn-lock-screen">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    Turn Off Phone Display
                </button>
                <button class="btn btn-danger" id="btn-disconnect">Disconnect</button>
            </div>
        </div>

        <!-- Taskbar / Dock -->
        <div id="taskbar" class="glass-panel">
            <button id="start-btn" title="Start Menu">
                <div class="dex-logo">⚡</div>
            </button>
            
            <div id="taskbar-apps" class="taskbar-apps">
                <!-- Open windows icons -->
            </div>

            <div class="taskbar-right">
                <button class="tray-btn" id="tray-game-mode" title="Toggle WASD / Mouse Lock Game Mode">
                    🎮 <span class="badge" id="game-mode-badge">OFF</span>
                </button>
                <button class="tray-btn" id="tray-wifi" title="LAN Latency">
                    📶 <span id="ping-text">-- ms</span>
                </button>
                <button class="tray-btn" id="tray-battery" title="Phone Battery">
                    🔋 <span id="battery-text">--%</span>
                </button>
                <div id="clock" class="clock">00:00</div>
            </div>
        </div>
    </div>

    <!-- Key Mapper Overlay Container (For Games) -->
    <div id="key-mapper-overlay" class="hidden">
        <div class="mapper-banner">
            <span>🎮 Game Control Mapping Active | Press <strong>ESC</strong> or <strong>F8</strong> to exit Pointer Lock</span>
            <button id="btn-save-keymap" class="btn btn-primary btn-sm">Save Bindings</button>
        </div>
        <div id="mapper-touch-canvas"></div>
    </div>

    <script src="js/streamer.js"></script>
    <script src="js/input-mapper.js"></script>
    <script src="js/desktop.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
